<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.93, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tallo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <style>
      /* 2. FORCE BOX SIZING (Fixes width+padding issues immediately) */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      /* 3. STRICT OVERFLOW CONTROL */
      html {
        -webkit-text-size-adjust: 100%; /* Prevents iOS text zoom */
        touch-action: manipulation; /* Improves touch response */
        overflow-x: hidden;
        width: 100%;
        height: 100%;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000208;
        color: #e2e8f0;
        /* Force body to never exceed viewport */
        width: 100%;
        max-width: 100vw; 
        min-height: 100%;
        overflow-x: hidden;
        position: relative;
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
      }

      /* 4. ROOT CONTAINER LOCK */
      #root {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Hide scrollbar */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .leaflet-default-icon-path {
        background-image: url(https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png);
      }
    </style>
    
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react/": "https://esm.sh/react@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
      }
    }
    </script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
